# openspec/config.yaml
schema: spec-driven
artifact_store: hybrid

context: |
  Tech stack: ASP.NET Core net9.0 Web API (backend) + React 19 SPA via Vite 8 (frontend)
  Architecture: Monorepo with /backend (Controllers → Services → EF Core → PostgreSQL)
    and /frontend (Vite + React). Backend uses interface-based service layer,
    custom auth policies, background hosted services, and Cloudflare R2 for images.
  Testing: xUnit + Moq + FsCheck (property-based) + Microsoft.AspNetCore.Mvc.Testing
    for backend. Frontend uses Vitest via React Testing Library (npm test / npx vitest run)
    plus ESLint linting. (Corrected at archive time — init claimed no frontend test runner.)
  Style: C# with implicit usings, nullable enabled; JSX without TypeScript.
  Test count: ~202 passing, 1 flaky (VerifyDatabaseSchema needs live Supabase). No coverage configured.
  Existing SDD change: ticketera-online fully lifecycle-tracked in openspec/changes/ticketera-online/.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference requirements by ID from openspec/changes/*/specs/
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Store per-domain spec files in openspec/changes/{change}/specs/{domain}/
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (Controller → Service → EF Core)
    tdd: true
    test_command: dotnet test
  verify:
    test_command: dotnet test
    build_command: dotnet build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  test_command: dotnet test
  frameworks:
    - xunit 2.9.3
    - moq 4.20.72
    - fscheck 3.0.0-rc3
    - Microsoft.AspNetCore.Mvc.Testing 9.0.0
  layers:
    unit: true
    integration: true
    e2e: false
  coverage_available: false
  quality_tools:
    linter: dotnet format (built-in) / ESLint (frontend)
    type_checker: false
    formatter: dotnet format (built-in)
  notes: |
    Backend: dotnet test (xUnit); Strict TDD applies to backend work.
    Frontend: npm test / npx vitest run (Vitest + React Testing Library) — added before
    the brand-design-system change; vitest IS the frontend test runner.
    test_command: dotnet test fields below remain the backend default; frontend
    verify/apply phases must override with `npm test` (per brand-design-system
    REQ-BDS-11). Corrected at archive time — init claimed no frontend test
    infrastructure, which was stale before brand-design-system.
